services:
  - type: web
    name: fullstack-todo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fullstack-todo-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mahnoor10-tech.github.io,http://localhost:5173,http://127.0.0.1:5173

databases:
  - name: fullstack-todo-db
    plan: free
    databaseName: todo_db
    user: todo_user
